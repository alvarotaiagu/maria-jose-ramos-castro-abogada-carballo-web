<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · María José Ramos Castro, Abogada</title>
<link rel="icon" href="assets/img/logo/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --blanco:#FAF8F6; --carbon:#2B2A28; --tinta:#57534E; --marca:#CB7F5E; --terracota:#A85E3F; }
  *,*::before,*::after { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; background:var(--blanco); color:var(--carbon);
    font-family:"Lora",Georgia,serif; line-height:1.7;
    background-image:repeating-linear-gradient(to bottom,transparent 0 39px,#E9E2DC 39px 40px);
    display:flex; align-items:center; padding:2rem clamp(1.1rem,6vw,5rem);
  }
  main { max-width:56ch; }
  p.eyebrow {
    font-family:"Inter",system-ui,sans-serif; font-size:.72rem; letter-spacing:.24em;
    text-transform:uppercase; color:#8A837C; margin:0 0 1.4rem;
  }
  h1 { font-weight:500; font-size:clamp(2rem,6vw,3.2rem); line-height:1.12; margin:0 0 1rem; }
  h1 em { font-style:italic; background:rgba(203,127,94,.32); padding:0 .16em; }
  p { color:var(--tinta); margin:0 0 1.6rem; }
  a.btn {
    display:inline-block; font-family:"Inter",system-ui,sans-serif; font-size:.92rem;
    background:var(--terracota); color:var(--blanco); padding:.85em 1.8em;
    text-decoration:none; border-radius:2px;
  }
  a.tel { color:inherit; border-bottom:2px solid rgba(203,127,94,.55); text-decoration:none; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Error 404</p>
  <h1>Esta cláusula <em>no consta</em> en el expediente.</h1>
  <p>La página que buscaba no existe o ha cambiado de dirección. Puede volver al inicio o llamar directamente al <a class="tel" href="tel:+34881129267">881 12 92 67</a>.</p>
  <a class="btn" href="./">Volver al inicio</a>
</main>
</body>
</html>
